<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gradient Generator | CSS-Flash</title>
  <meta name="description" content="CSS-Flash gradient generator CSS tool to create linear and radial gradients with live preview and copy-ready HTML/CSS code." />
  <meta name="keywords" content="gradient generator CSS, CSS gradient generator, linear gradient generator, radial gradient CSS, CSS-Flash" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <main class="main-content">
    <section id="gradient" class="tool-section active">
      <div class="section-header">
        <h1>Gradient Generator</h1>
        <p>Generate beautiful linear and radial CSS gradients with live preview.</p>
      </div>
      <div class="tool-layout">
        <div class="controls-panel">
          <div class="control-group">
            <label>Type</label>
            <div class="btn-group">
              <button class="seg-btn active" data-grad-type="linear">Linear</button>
              <button class="seg-btn" data-grad-type="radial">Radial</button>
            </div>
          </div>
          <div class="control-group" id="angleGroup">
            <label>Angle: <span id="angleVal">135</span>deg</label>
            <input type="range" id="gradAngle" min="0" max="360" value="135" />
          </div>
          <div class="control-group">
            <label>Color 1</label>
            <div class="color-row">
              <input type="color" id="gradColor1" value="#6c63ff" />
              <input type="text" id="gradColor1Hex" value="#6c63ff" class="hex-input" />
            </div>
          </div>
          <div class="control-group">
            <label>Color 2</label>
            <div class="color-row">
              <input type="color" id="gradColor2" value="#ff6b9d" />
              <input type="text" id="gradColor2Hex" value="#ff6b9d" class="hex-input" />
            </div>
          </div>
          <div class="control-group">
            <label>Color 3 (optional)</label>
            <div class="color-row">
              <input type="color" id="gradColor3" value="#ffd93d" />
              <input type="text" id="gradColor3Hex" value="#ffd93d" class="hex-input" />
              <label class="switch"><input type="checkbox" id="gradColor3On" /><span class="slider"></span></label>
            </div>
          </div>
          <div class="action-row">
            <button class="btn-copy" id="copyGradientHtml">Copy HTML</button>
            <button class="btn-copy" id="copyGradientCss">Copy CSS</button>
            <button class="btn-reset" id="resetGradient">Reset</button>
          </div>
        </div>
        <div class="preview-panel">
          <div class="preview-box" id="gradientPreview"></div>
          <div class="code-block"><pre id="gradientCode"></pre></div>
        </div>
      </div>
    </section>
  </main>
  <div class="toast" id="toast">Code copied</div>
  <script src="../js/main.js"></script>
</body>
</html>
