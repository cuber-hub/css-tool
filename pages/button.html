<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Button Generator | css-flash</title>
  <meta name="description" content="CSS-Flash CSS button generator to design custom button styles with color, spacing, border, and radius controls." />
  <meta name="keywords" content="CSS button generator, button generator CSS, custom button CSS tool, button style generator, CSS-Flash" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <main class="main-content">
    <section id="button" class="tool-section active">
      <div class="section-header">
        <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;">
          <div>
            <h1>🔘 CSS Button Generator</h1>
            <p>Style custom CSS buttons with colors, padding, border and hover effects.</p>
          </div>
          <a href="buttons-library.html" class="btn-copy" style="max-width: fit-content; text-decoration: none; padding: 10px 20px; background: var(--bg-card); border: 1px solid var(--accent); color: var(--accent);">🏗️ Use Pre-built Library</a>
        </div>
      </div>
      <div class="tool-layout">
        <div class="controls-panel">
          <div class="control-group"><label>Button Text</label><input type="text" id="btnText" value="Click Me" class="text-input" /></div>
          <div class="control-group"><label>Background Color</label><div class="color-row"><input type="color" id="btnBg" value="#6c63ff" /><input type="text" id="btnBgHex" value="#6c63ff" class="hex-input" /></div></div>
          <div class="control-group"><label>Text Color</label><div class="color-row"><input type="color" id="btnColor" value="#ffffff" /><input type="text" id="btnColorHex" value="#ffffff" class="hex-input" /></div></div>
          <div class="control-group"><label>Padding H: <span id="btnPHVal">24</span>px</label><input type="range" id="btnPH" min="4" max="80" value="24" /></div>
          <div class="control-group"><label>Padding V: <span id="btnPVVal">12</span>px</label><input type="range" id="btnPV" min="4" max="40" value="12" /></div>
          <div class="control-group"><label>Border Radius: <span id="btnBRVal">8</span>px</label><input type="range" id="btnBR" min="0" max="50" value="8" /></div>
          <div class="control-group"><label>Font Size: <span id="btnFSVal">16</span>px</label><input type="range" id="btnFS" min="10" max="32" value="16" /></div>
          <div class="control-group"><label>Border Width: <span id="btnBWVal">0</span>px</label><input type="range" id="btnBW" min="0" max="6" value="0" /></div>
          <div class="control-group"><label>Border Color</label><div class="color-row"><input type="color" id="btnBC" value="#6c63ff" /></div></div>
          <div class="action-row">
            <button class="btn-copy" id="copyButtonHtml">Copy HTML</button>
            <button class="btn-copy" id="copyButtonCss">Copy CSS</button>
            <button class="btn-copy" id="copyButtonTw">Tailwind</button>
            <button class="btn-reset" id="resetButton">Reset</button>
          </div>
        </div>
        <div class="preview-panel">
          <div class="preview-box btn-canvas"><button class="btn-preview" id="buttonPreview">Click Me</button></div>
          <div class="code-block"><pre id="buttonCode"></pre></div>
        </div>
      </div>
    </section>
  </main>
  <div class="toast" id="toast">Code copied</div>
  <script src="../js/main.js"></script>
</body>
</html>
