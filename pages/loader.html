<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loader Generator | css-flash</title>
  <meta name="description" content="CSS-Flash loader generator to build CSS spinners and loaders with speed, size, and color customization." />
  <meta name="keywords" content="CSS loader generator, spinner generator CSS, loading animation CSS, CSS spinner tool, CSS-Flash" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <main class="main-content">
    <section id="loader" class="tool-section active">
      <div class="section-header"><h1>Loader / Spinner Generator</h1><p>Pick a loader style and customize color and animation speed.</p></div>
      <div class="tool-layout">
        <div class="controls-panel">
          <div class="control-group"><label>Loader Style</label><select id="loaderType"><option value="ring">Ring Spinner</option><option value="dots">Bouncing Dots</option><option value="bars">Pulsing Bars</option><option value="dual">Dual Ring</option><option value="ripple">Ripple</option></select></div>
          <div class="control-group"><label>Color</label><div class="color-row"><input type="color" id="loaderColor" value="#6c63ff" /><input type="text" id="loaderColorHex" value="#6c63ff" class="hex-input" /></div></div>
          <div class="control-group"><label>Speed: <span id="loaderSpeedVal">1</span>s</label><input type="range" id="loaderSpeed" min="1" max="30" value="10" /></div>
          <div class="control-group"><label>Size: <span id="loaderSizeVal">50</span>px</label><input type="range" id="loaderSize" min="20" max="120" value="50" /></div>
          <div class="action-row"><button class="btn-copy" id="copyLoaderHtml">Copy HTML</button><button class="btn-copy" id="copyLoaderCss">Copy CSS</button><button class="btn-copy" id="copyLoaderTw">Tailwind</button><button class="btn-reset" id="resetLoader">Reset</button></div>
        </div>
        <div class="preview-panel"><div class="preview-box loader-canvas"><div id="loaderPreview"></div></div><div class="code-block"><pre id="loaderCode"></pre></div></div>
      </div>
    </section>
  </main>
  <div class="toast" id="toast">Code copied</div>
  <script src="../js/main.js"></script>
</body>
</html>
