<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glassmorphism Generator | css-flash</title>
  <meta name="description" content="CSS-Flash CSS glassmorphism generator to create frosted glass UI effects with blur, opacity, border, and radius controls." />
  <meta name="keywords" content="CSS glassmorphism generator, glass effect CSS, frosted glass CSS, glassmorphism tool, CSS-Flash" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <main class="main-content">
    <section id="glass" class="tool-section active">
      <div class="section-header">
        <h1>CSS Glassmorphism Generator</h1>
        <p>Create stunning frosted-glass UI cards with blur, transparency and border.</p>
      </div>
      <div class="tool-layout">
        <div class="controls-panel">
          <div class="control-group"><label>Blur: <span id="glassBlurVal">12</span>px</label><input type="range" id="glassBlur" min="0" max="40" value="12" /></div>
          <div class="control-group"><label>Transparency: <span id="glassOpacityVal">0.15</span></label><input type="range" id="glassOpacity" min="0" max="60" value="15" /></div>
          <div class="control-group"><label>Border Opacity: <span id="glassBorderVal">0.3</span></label><input type="range" id="glassBorder" min="0" max="100" value="30" /></div>
          <div class="control-group"><label>Border Radius: <span id="glassRadiusVal">16</span>px</label><input type="range" id="glassRadius" min="0" max="40" value="16" /></div>
          <div class="control-group"><label>Background Color</label><div class="color-row"><input type="color" id="glassBg" value="#ffffff" /></div></div>
          <div class="action-row">
            <button class="btn-copy" id="copyGlassHtml">Copy HTML</button>
            <button class="btn-copy" id="copyGlassCss">Copy CSS</button>
            <button class="btn-reset" id="resetGlass">Reset</button>
          </div>
        </div>
        <div class="preview-panel">
          <div class="preview-box glass-canvas" id="glassCanvas"><div class="glass-demo" id="glassPreview"><h3>Glass Card</h3><p>Glassmorphism effect</p></div></div>
          <div class="code-block"><pre id="glassCode"></pre></div>
        </div>
      </div>
    </section>
  </main>
  <div class="toast" id="toast">Code copied</div>
  <script src="../js/main.js"></script>
</body>
</html>
